[pytest]
DJANGO_SETTINGS_MODULE = hidos.settings.test
python_files = tests.py test_*.py
testpaths = app cell fs users
addopts = -ra --strict-markers
markers =
    analysis: runs the real image analysis algorithms on the example images (slow; deselect with -m "not analysis")
filterwarnings =
    ignore::DeprecationWarning:pkg_resources

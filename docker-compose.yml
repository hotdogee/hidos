# HiDOS Cell Cloud: the whole stack on one machine.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d --build
#   docker compose exec web python manage.py createsuperuser
#
# http://localhost:8080/cell/   landing page (hidos-express)
# http://localhost:8080/admin/  Django admin
# http://localhost:8080/api/v1/ REST API
name: hidos

x-django: &django
  image: hidos-django:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://django:${POSTGRES_PASSWORD:-django}@db:5432/django
    CELERY_BROKER_URL: amqp://hidos:${RABBITMQ_PASSWORD:-hidos}@broker:5672//
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
  volumes:
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy
    broker:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *django
    build: ./hidos-django/hidos
    command: >-
      sh -c "python manage.py migrate --noinput &&
             gunicorn hidos.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - media:/data/media
      - chunked_uploads:/data/chunked_uploads

  worker:
    <<: *django
    pull_policy: never  # uses the image built for web
    command: celery -A hidos worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} -Q cell -n cell.%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A hidos inspect ping --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s

  landing:
    build: ./hidos-express
    image: hidos-express:latest
    environment:
      CELL_CLOUD_LOGIN_URL: ${CELL_CLOUD_LOGIN_URL:-/login}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HIDOS_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    depends_on:
      web:
        condition: service_healthy
      landing:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: django
      POSTGRES_USER: django
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d django"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  broker:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hidos
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hidos}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  media:
  chunked_uploads:
  rabbitmq:

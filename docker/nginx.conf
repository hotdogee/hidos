# nginx in front of the compose stack (see docker-compose.yml).
# TLS is expected to be terminated in front of this (see tools/nginx for
# the 2016 hidos.io setup); X-Forwarded-Proto is passed through.
# If nginx is the public edge (no TLS proxy in front), replace
# $forwarded_proto with $scheme below so clients can't claim https.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    # uploaded images and analysis results
    location /media/ {
        alias /data/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # landing page (hidos-express)
    location = / {
        return 302 /cell/;
    }
    location /cell/ {
        proxy_pass http://landing:3000/;
        proxy_set_header Host $http_host;
    }

    # Django: API, admin, accounts, login, result viewer, static files
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }
}

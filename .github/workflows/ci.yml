name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: django
          POSTGRES_USER: django
          POSTGRES_PASSWORD: django
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django -d django"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://django:django@localhost:5432/django
      DJANGO_SETTINGS_MODULE: hidos.settings.test
    defaults:
      run:
        working-directory: hidos-django/hidos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # the default glob (**/*requirements*.txt) matches none of requirements/*.txt
          cache-dependency-glob: hidos-django/hidos/requirements/*.txt
          cache-suffix: py${{ matrix.python-version }}
      - name: Install dependencies
        run: uv pip install --system -r requirements/test.txt
      - name: Lint
        run: ruff check .
      - name: Django system checks
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate a fresh database
        run: python manage.py migrate --noinput
      - name: Production deployment checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: hidos.settings.production
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-0123456789
      - name: Tests (PostgreSQL, including the real image analysis)
        run: pytest --cov=. --cov-report=term-missing:skip-covered

  landing:
    name: Landing page (hidos-express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hidos-express
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hidos-express/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images and compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" > .env
          docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up --detach --wait --wait-timeout 300
      - name: End-to-end smoke test
        run: python3 docker/smoke_test.py http://localhost:8080
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes
